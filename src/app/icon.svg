<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fad0c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a18cd1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 渐变背景球体 -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" stroke="#ffffff" stroke-width="2" />
  
  <!-- 可爱的表情 -->
  <!-- 左眼 -->
  <circle cx="35" cy="45" r="4" fill="#ffffff" />
  <!-- 右眼 -->
  <circle cx="65" cy="45" r="4" fill="#ffffff" />
  
  <!-- 腮红 -->
  <circle cx="30" cy="55" r="5" fill="#ff758c" opacity="0.4" filter="url(#glow)" />
  <circle cx="70" cy="55" r="5" fill="#ff758c" opacity="0.4" filter="url(#glow)" />

  <!-- 嘴巴 (微笑) -->
  <path d="M 40 60 Q 50 68 60 60" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- 装饰星星 -->
  <path d="M 80 20 L 82 25 L 87 25 L 83 28 L 85 33 L 80 30 L 75 33 L 77 28 L 73 25 L 78 25 Z" fill="#fff" opacity="0.8" />
  <path d="M 20 80 L 21 83 L 24 83 L 22 85 L 23 88 L 20 86 L 17 88 L 18 85 L 16 83 L 19 83 Z" fill="#fff" opacity="0.6" />
</svg>